<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thinking Out Loud</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --topbar: 56px;
      --bg: #1A1714;
      --accent: #D97757;
      --text: #F5AD8C;
      --text-muted: #7A6E66;
      --border: rgba(245, 173, 140, 0.1);
      --sans: 'DM Sans', sans-serif;
      --radius: 10px;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 50% 55%, rgba(217, 119, 87, 0.055) 0%, transparent 65%),
        radial-gradient(ellipse 70% 50% at 15% 85%, rgba(217, 119, 87, 0.025) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    /* ── Topbar ── */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: var(--topbar);
      border-bottom: 1px solid var(--border);
      background: rgba(26, 23, 20, 0.9);
      backdrop-filter: blur(14px);
      z-index: 20;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .logo-mark {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-pill {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      color: var(--text);
      background: rgba(245, 173, 140, 0.1);
      border: 1px solid rgba(245, 173, 140, 0.22);
      border-radius: 100px;
      padding: 3px 11px;
      letter-spacing: 0.07em;
      display: flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    /* ── Essay box ── */
    /* Desktop default: 40vw x 40vh centered */
    .essay-box {
      position: relative;
      z-index: 1;
      width: 40vw;
      height: 40vh;
      overflow-y: hidden;
      overflow-x: hidden;
      -webkit-mask-image: linear-gradient(to bottom,
          transparent 0%,
          rgba(0, 0, 0, 0.1) 5%,
          rgba(0, 0, 0, 0.55) 11%,
          black 20%,
          black 100%);
      mask-image: linear-gradient(to bottom,
          transparent 0%,
          rgba(0, 0, 0, 0.1) 5%,
          rgba(0, 0, 0, 0.55) 11%,
          black 20%,
          black 100%);
      scroll-behavior: smooth;
      animation: fadeIn 0.7s ease both 0.15s;
      opacity: 0;
    }

    .essay-box::-webkit-scrollbar {
      width: 3px;
    }

    .essay-box::-webkit-scrollbar-track {
      background: transparent;
    }

    .essay-box::-webkit-scrollbar-thumb {
      background: rgba(245, 173, 140, 0.22);
      border-radius: 2px;
    }

    .essay-inner {
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 0.5rem;
    }

    .essay-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      line-height: 1.95;
      color: var(--text);
      text-align: left;
      letter-spacing: 0.05em;
      word-break: normal;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .essay-box.done {
      overflow-y: auto;
    }

    .essay-box.done .essay-inner {
      justify-content: flex-start;
      padding-top: 16%;
    }

    .para-break {
      display: block;
      height: 1.1em;
    }

    /* ── Robot ── */
    .robot-cursor {
      display: inline-block;
      width: 24px;
      height: 24px;
      vertical-align: middle;
      margin-left: 3px;
      position: relative;
      top: -2px;
      animation: robotBob 0.11s ease-in-out infinite alternate;
    }

    .robot-cursor.idle {
      animation: robotIdle 1.8s ease-in-out infinite alternate;
    }

    /* ── Scroll hint ── */
    .scroll-hint {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
    }

    .scroll-hint.visible {
      opacity: 0.5;
    }

    .scroll-hint svg {
      animation: bounceDown 1.5s ease-in-out infinite;
    }

    /* ── Animations ── */
    @keyframes robotBob {
      from {
        transform: translateY(0px) rotate(-1.5deg) scale(1);
      }

      to {
        transform: translateY(-3px) rotate(1.5deg) scale(1.04);
      }
    }

    @keyframes robotIdle {
      from {
        transform: translateY(0) rotate(0deg);
      }

      to {
        transform: translateY(-2px) rotate(0deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounceDown {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(4px);
      }
    }

    @keyframes eyeFlicker {

      0%,
      91%,
      100% {
        opacity: 0.9;
      }

      93%,
      97% {
        opacity: 0.15;
      }
    }

    /* ══════════════════════════════════════════
     RESPONSIVE BREAKPOINTS
  ══════════════════════════════════════════ */

    /* Portrait phones (≤ 480px) */
    @media (max-width: 480px) {
      :root {
        --topbar: 46px;
      }

      .topbar {
        padding: 0 1rem;
      }

      .logo {
        font-size: 13px;
        gap: 7px;
      }

      .logo-mark {
        width: 22px;
        height: 22px;
        border-radius: 5px;
      }

      .logo span {
        display: none;
      }

      /* hide "Claude" wordmark, keep logo mark */

      .essay-box {
        width: 88vw;
        height: 58vh;
      }

      .essay-text {
        font-size: 0.76rem;
        line-height: 1.8;
        letter-spacing: 0.025em;
      }

      .robot-cursor {
        width: 18px;
        height: 18px;
      }

      .scroll-hint {
        font-size: 9px;
        bottom: 0.8rem;
      }
    }

    /* Landscape phones / small tablets (481px – 768px) */
    @media (min-width: 481px) and (max-width: 768px) {
      :root {
        --topbar: 50px;
      }

      .topbar {
        padding: 0 1.25rem;
      }

      .essay-box {
        width: 72vw;
        height: 52vh;
      }

      .essay-text {
        font-size: 0.82rem;
        line-height: 1.88;
      }

      .robot-cursor {
        width: 21px;
        height: 21px;
      }
    }

    /* Tablets (769px – 1024px) */
    @media (min-width: 769px) and (max-width: 1024px) {
      .essay-box {
        width: 58vw;
        height: 46vh;
      }

      .essay-text {
        font-size: 0.9rem;
      }
    }

    /* Standard desktop (1025px – 1399px): 40vw x 40vh — already set as default */

    /* Large / wide screens (≥ 1400px) */
    @media (min-width: 1400px) {
      .essay-box {
        width: 36vw;
        height: 40vh;
      }

      .essay-text {
        font-size: 1rem;
      }
    }

    /* ── Action Button (UI Kit Style) ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.01em;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0);
      transition: background 0.15s;
    }

    .btn:hover::after {
      background: rgba(255, 255, 255, 0.04);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #1A0E08;
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(217, 119, 87, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 4px 20px rgba(217, 119, 87, 0.45);
    }

    .delve-btn {
      display: none;
      position: fixed;
      bottom: 4.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      opacity: 0;
      z-index: 100;
    }

    .delve-btn.visible {
      display: inline-flex;
      animation: slowFadeIn 5s ease forwards;
    }

    @keyframes slowFadeIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="essay-box" id="essay-box">
      <div class="essay-inner" id="essay-inner">
        <div class="essay-text" id="essay-text" aria-live="polite"></div>
      </div>
    </div>

    <button id="delve-btn" class="delve-btn btn btn-primary">Skip and delve in</button>
  </div>

  <div class="scroll-hint" id="scroll-hint">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
      <path d="M2 3L5 7L8 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    scroll to read
  </div>

  <script>
    const ESSAY = [
      "Hi Chief, my name is Gifted, and I want to take you on a journey to Super-Intelligence.",
      "",
      "Think about termites. A single termite isn't so intelligent; isolated, it behaves quite simply. Yet, when you take multitudes of them, assign specific roles, and give them a structured way to communicate, they build incredibly complex mounds that requires an extreme level of intelligence to build. The intelligence isn't in the termite—it's in the organizational architecture they operate in.",
      "",
      "The human brain works exactly the same way. A single neuron isn't intelligent. But arrange millions of them into a specific structure with precise communication rules, and human intelligence emerges.",
      "",
      "Even the Burj Khalifa wasn't built by one super-intelligent entity. No single person had all the domain knowledge required. It took multitudes of humans with different specializations, arranged in a specific organizational architecture, to produce a super-intelligent outcome.",
      "",
      "Chief, after studying these patterns, I realized in December 2024 that Super-Intelligence is an architectural problem.",
      "",
      "I immediately started drafting a conceptual architecture using current AI models. So far, I've built a functional prototype of a \"system of systems\" that demonstrates human-level intelligence in backend software development. I also applied this concept to thinking in LLMs, and I built a thinking machine prototype with extreme depths of creative reasoning that could exceed today's best models.",
      "",
      "Right now, the AI industry is pouring billions of dollars into building larger models—essentially building bigger nuclear reactors. Yet, we are using these reactors to power toasters.",
      "",
      "We will never realize the ROI on the billions invested in AI until these systems can perform complex tasks with full autonomy and negligible hallucination. How well we can achieve this is determined by how much intelligence we can produce from them, and how much intelligence we can produce is determined by how well we design these cognitive architectures.",
      "",
      "Scaling laws will soon plateau, and open-source alternatives will converge toward state-of-the-art capabilities. The decisive advantage will no longer reside in owning the smartest individual model, but in the cognitive architecture that extracts maximum value (Intelligence) from it.",
      "",
      "This is my quest and my passion: to build the cognitive architectures that will extend the capabilities of AI models until we achieve true super, general intelligence."
    ];

    const ROBOT_SVG = `<svg class="robot-cursor" id="robot" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <line x1="16" y1="2" x2="16" y2="7" stroke="#F5AD8C" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="1.5" r="1.5" fill="#F5AD8C"/>
  <rect x="7" y="7" width="18" height="13" rx="3" fill="#221F1C" stroke="#F5AD8C" stroke-width="1.1"/>
  <rect x="10" y="10.5" width="4" height="4" rx="1" fill="#F5AD8C" style="animation:eyeFlicker 3s ease-in-out infinite"/>
  <rect x="18" y="10.5" width="4" height="4" rx="1" fill="#F5AD8C" style="animation:eyeFlicker 3s ease-in-out infinite .18s"/>
  <rect x="12.5" y="17.5" width="7" height="1.2" rx="0.6" fill="#F5AD8C" opacity="0.4"/>
  <rect x="10" y="21" width="12" height="7" rx="2" fill="#221F1C" stroke="#F5AD8C" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="23" x2="3.5" y2="26.5" stroke="#F5AD8C" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="22" y1="23" x2="28.5" y2="26.5" stroke="#F5AD8C" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="3" cy="27" r="1.3" fill="#F5AD8C" opacity="0.7"/>
  <circle cx="29" cy="27" r="1.3" fill="#F5AD8C" opacity="0.7"/>
</svg>`;

    const essayBox = document.getElementById('essay-box');
    const container = document.getElementById('essay-text');
    const statusLabel = document.getElementById('status-label');
    const statusDot = document.getElementById('status-dot');
    const scrollHint = document.getElementById('scroll-hint');

    const segments = [];
    for (let li = 0; li < ESSAY.length; li++) {
      const line = ESSAY[li];
      if (line === '') {
        segments.push({ type: 'break' });
      } else {
        for (let ci = 0; ci < line.length; ci++) {
          segments.push({ type: 'char', ch: line[ci] });
        }
        if (li < ESSAY.length - 1) segments.push({ type: 'newline' });
      }
    }

    let typed = [], idx = 0;
    let typingTimer;

    function esc(ch) {
      return ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
    }

    function render() {
      let html = '';
      for (const s of typed) {
        if (s.type === 'char') html += esc(s.ch);
        else if (s.type === 'newline') html += '<br>';
        else if (s.type === 'break') html += '<span class="para-break"></span>';
      }
      html += ROBOT_SVG;
      container.innerHTML = html;
      essayBox.scrollTop = essayBox.scrollHeight;
    }

    function delay(seg) {
      if (!seg) return 60;

      // Paragraph Transitions: Deep pauses (1s - 1.5s)
      if (seg.type === 'break') return 1000 + Math.random() * 500;

      if (seg.type === 'newline') return 65;

      if (seg.type === 'char') {
        const c = seg.ch;

        // Thoughtful Pauses: End of sentences (700ms - 1200ms)
        if (/[.?!]/.test(c)) return 700 + Math.random() * 500;

        // Rhythmic Breaks: Mid-sentence pauses (350ms - 700ms)
        if (/[,;:\-—]/.test(c)) return 350 + Math.random() * 350;

        // Spaces: Slight pause
        if (c === ' ') return 50 + Math.random() * 50;
      }

      // Varied Character Speed: Base jitter (40ms - 100ms)
      return 40 + Math.random() * 60;
    }

    function onDone() {
      const robot = document.getElementById('robot');
      if (robot) robot.classList.add('idle');

      // Update button text and ensure visibility
      const btn = document.getElementById('delve-btn');
      if (btn) {
        btn.textContent = 'Delve in';
        btn.classList.add('visible');
      }

      statusLabel.textContent = 'done';
      statusDot.style.animation = 'none';
      statusDot.style.opacity = '0.35';
      essayBox.classList.add('done');
      setTimeout(() => {
        essayBox.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => scrollHint.classList.add('visible'), 900);
      }, 350);
    }

    function typeNext() {
      if (idx >= segments.length) { onDone(); return; }

      const currentSeg = segments[idx++];
      typed.push(currentSeg);
      render();

      // Use the delay of the character JUST typed
      typingTimer = setTimeout(typeNext, delay(currentSeg));
    }

    function skipTyping() {
      clearTimeout(typingTimer);
      typed = segments.slice(); // Copy all segments to typed
      idx = segments.length;
      render();
      onDone();
    }

    essayBox.addEventListener('scroll', () => {
      scrollHint.style.opacity = '0';
      setTimeout(() => scrollHint.classList.remove('visible'), 500);
    }, { once: true });

    setTimeout(() => {
      render();
      setTimeout(typeNext, 700);

      // Show button after 25 seconds into the site (if not already visible)
      setTimeout(() => {
        const btn = document.getElementById('delve-btn');
        btn.classList.add('visible');
      }, 24650);
    }, 350);

    // Button Click Logic: Skip or Navigate
    document.getElementById('delve-btn').addEventListener('click', () => {
      if (idx < segments.length) {
        skipTyping();
      } else {
        // Navigation or next action goes here
        window.location.href = "portfolio.html";
      }
    });
  </script>
</body>

</html>
